# Primary deployment: Cloudflare Worker with static assets
# Deploy command: npx wrangler deploy
#
# For pure Cloudflare Pages instead:
#   - Leave Build command empty
#   - Build output directory: public
#   - The functions/ directory will be picked up automatically
#   - Do NOT set a Deploy command of "npx wrangler deploy"

name = "nextgen-smart-classroom"
main = "worker/src/index.js"
compatibility_date = "2024-11-01"

[assets]
directory = "./public"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "nextgen-smart-classroom"
# Replace with your real D1 database ID after creating it in the dashboard
# or via: npx wrangler d1 create nextgen-smart-classroom
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
